<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>brainfi — Muy pronto</title>
<meta name="description" content="Inteligencia financiera para PYMEs españolas. Muy pronto."/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Inter', sans-serif;
  background: #4361EE;
  min-height: 100vh;
  display: flex;
  -webkit-font-smoothing: antialiased;
}



/* Contenido */
.content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 32px 52px 40px;
  width: 100%;
  min-height: 100vh;
}

/* Logo */
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-mark {
  width: 32px;
  height: 32px;
  background: rgba(255,255,255,0.2);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.logo-name {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.4px;
}

/* Main */
.main {
  max-width: 520px;
  padding-bottom: 20px;
}
.eyebrow {
  font-size: 15px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 16px;
  font-weight: 400;
}
h1 {
  font-size: clamp(72px, 10vw, 110px);
  font-weight: 800;
  color: #fff;
  line-height: 0.95;
  letter-spacing: -0.04em;
  margin-bottom: 28px;
}
.desc {
  font-size: 15px;
  color: rgba(255,255,255,0.65);
  line-height: 1.7;
  max-width: 400px;
  margin-bottom: 36px;
}

/* Form */
.form-label {
  font-size: 13px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 10px;
  display: block;
}
.form-check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  cursor: pointer;
}
.form-check input[type="checkbox"] {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  accent-color: #fff;
  cursor: pointer;
}
.form-check span {
  font-size: 13px;
  color: rgba(255,255,255,0.65);
}
.form-row {
  display: flex;
  align-items: flex-start;
  flex-direction: column;
  gap: 20px;
  max-width: 420px;
}
input[type="email"] {
  padding: 14px 18px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  background: rgba(255,255,255,0.12);
  border: 1.5px solid rgba(255,255,255,0.2);
  border-radius: 6px;
  outline: none;
  color: #fff;
  width: 100%;
  max-width: 420px;
  display: block;
  transition: border-color .15s, background .15s;
}
input[type="email"]:focus {
  border-color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.16);
}
input[type="email"]::placeholder { color: rgba(255,255,255,0.4); }
.btn-signup {
  padding: 14px 28px;
  font-size: 14px;
  font-weight: 600;
  color: #4361EE;
  background: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: background .15s, transform .1s;
  white-space: nowrap;
}
.btn-signup:hover { background: #f0f0f8; transform: scale(1.02); }
.success {
  display: none;
  margin-top: 14px;
  font-size: 13px;
  color: rgba(255,255,255,0.9);
  font-weight: 500;
  display: none;
}

/* Footer */
.footer {
  display: flex;
  align-items: center;
  gap: 24px;
}
.footer a {
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  text-decoration: none;
  transition: color .15s;
}
.footer a:hover { color: rgba(255,255,255,0.8); }

/* Botón acceder en esquina */
.access-btn {
  position: fixed;
  top: 32px;
  right: 52px;
  z-index: 10;
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: color .15s;
}
.access-btn:hover { color: #fff; }

@media (max-width: 640px) {
  .content { padding: 24px 28px 32px; }
  h1 { font-size: 64px; }
  .access-btn { right: 28px; top: 26px; }
  input[type="email"] { width: 100%; }
  .form-row { flex-direction: column; align-items: flex-start; }
  .btn-signup { width: 100%; text-align: center; }
}
</style>
</head>
<body>



<a href="https://app.brainfi.io" class="access-btn">Acceder al portal →</a>

<div class="content">
  <!-- Logo -->
  <div class="logo">
    <div class="logo-mark">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none">
        <path d="M3 2h5a3 3 0 010 6H3V2z" fill="white"/>
        <path d="M3 8h6a3 3 0 010 6H3V8z" fill="rgba(255,255,255,0.6)"/>
      </svg>
    </div>
    <span class="logo-name">brainfi</span>
  </div>

  <!-- Main -->
  <div class="main">
    <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:5px 14px;font-size:12px;font-weight:500;color:rgba(255,255,255,0.9);margin-bottom:20px;">Software de predicción financiera</div>
    <h1>Muy<br>pronto.</h1>
    <p class="desc">Únete a la lista de espera para ser el primero en tener acceso anticipado a la plataforma.</p>

    <label class="form-label">Email *</label>
    <input type="email" id="email" placeholder="tu@empresa.com" autocomplete="email"/>
    <div class="form-row">
      <button class="btn-signup" onclick="handleSubmit()" style="width:100%;max-width:420px;text-align:center;">Apuntarme</button>
    </div>
    <div class="success" id="success-msg">✓ Apuntado. Te avisamos en cuanto abramos.</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="mailto:hola@brainfi.io">hola@brainfi.io</a>
    <a href="#">Privacidad</a>
    <span style="font-size:12px;color:rgba(255,255,255,0.25);">© 2026 brainfi.io </span>
  </div>
</div>

<script>
function handleSubmit() {
  const email = document.getElementById('email').value.trim()
  if (!email || !email.includes('@')) {
    document.getElementById('email').style.borderColor = 'rgba(255,100,100,0.6)'
    document.getElementById('email').focus()
    return
  }
  document.getElementById('email').style.borderColor = 'rgba(255,255,255,0.2)'
  const success = document.getElementById('success-msg')
  success.style.display = 'block'
  const btn = document.querySelector('.btn-signup')
  btn.disabled = true
  btn.style.background = 'rgba(255,255,255,0.3)'
  btn.style.color = 'rgba(255,255,255,0.6)'
  btn.textContent = '✓ Apuntado'
  document.getElementById('email').disabled = true

  fetch('https://formsubmit.co/ajax/a8f3c2d1e4b7691025f8a3c6d9e2b104', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      email,
      newsletter: document.getElementById('newsletter').checked,
      _subject: 'Lista de espera brainfi.io'
    })
  }).catch(() => {})
}
document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSubmit()
})
</script>

</body>
</html>
